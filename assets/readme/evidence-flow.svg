<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img"><title>From an action to an independently checked proof.</title><desc>A durable database write and an on-chain confirmation are separate, visible stages.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:35px;font-weight:700;fill:#eef4ff}.label{font-size:21px;font-weight:700;fill:#eef4ff}.body{font-size:17px;fill:#a4b5d0}.micro{font-size:13px;fill:#40e8ed;letter-spacing:2px}.edge{fill:none;stroke:#40e8ed;stroke-width:2;marker-end:url(#arrow)}.secondary{fill:none;stroke:#a995ff;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#purple)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#40e8ed"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a995ff"/></marker></defs><rect width="1280" height="680" rx="20" fill="#080e20"/>
<text x="48" y="63" class="title">From an action to an independently checked proof.</text>
<text x="48" y="99" class="body">A durable database write and an on-chain confirmation are separate, visible stages.</text>
<rect x="48" y="162" width="208" height="170" rx="14" fill="#101b32" stroke="#263853"/><rect x="48" y="180" width="3" height="134" rx="1" fill="#40e8ed"/><text x="70" y="191" class="micro" style="fill:#40e8ed">01 / CAPTURE</text><text x="70" y="222" class="label">Hash the step</text>
<text x="70" y="251" class="body">Agent + action</text>
<text x="70" y="276" class="body">Input / output hashes</text>
<path d="M256 246 H286" class="edge"/>
<rect x="292" y="162" width="208" height="170" rx="14" fill="#101b32" stroke="#263853"/><rect x="292" y="180" width="3" height="134" rx="1" fill="#40e8ed"/><text x="314" y="191" class="micro" style="fill:#40e8ed">02 / COMMIT</text><text x="314" y="222" class="label">Write atomically</text>
<text x="314" y="251" class="body">Step + outbox</text>
<text x="314" y="276" class="body">One DB transaction</text>
<path d="M500 246 H530" class="edge"/>
<rect x="536" y="162" width="208" height="170" rx="14" fill="#101b32" stroke="#263853"/><rect x="536" y="180" width="3" height="134" rx="1" fill="#40e8ed"/><text x="558" y="191" class="micro" style="fill:#40e8ed">03 / BATCH</text><text x="558" y="222" class="label">Build the tree</text>
<text x="558" y="251" class="body">Ordered leaves</text>
<text x="558" y="276" class="body">One Merkle root</text>
<path d="M744 246 H774" class="edge"/>
<rect x="780" y="162" width="208" height="170" rx="14" fill="#101b32" stroke="#263853"/><rect x="780" y="180" width="3" height="134" rx="1" fill="#40e8ed"/><text x="802" y="191" class="micro" style="fill:#40e8ed">04 / CONFIRM</text><text x="802" y="222" class="label">Anchor the root</text>
<text x="802" y="251" class="body">Async chain write</text>
<text x="802" y="276" class="body">Receipt + block</text>
<path d="M988 246 H1018" class="edge"/>
<rect x="1024" y="162" width="208" height="170" rx="14" fill="#101b32" stroke="#263853"/><rect x="1024" y="180" width="3" height="134" rx="1" fill="#72efb0"/><text x="1046" y="191" class="micro" style="fill:#72efb0">05 / CHECK</text><text x="1046" y="222" class="label">Verify the proof</text>
<text x="1046" y="251" class="body">Leaf + sibling path</text>
<text x="1046" y="276" class="body">Compare with root</text>
<rect x="48" y="398" width="560" height="170" rx="14" fill="#101b32" stroke="#263853"/><rect x="48" y="416" width="3" height="134" rx="1" fill="#a995ff"/><text x="70" y="427" class="micro" style="fill:#a995ff">LOCAL CHECK</text><text x="70" y="458" class="label">Does this proof reconstruct its supplied root?</text>
<text x="70" y="487" class="body">Fold the leaf with its sibling hashes.</text>
<text x="70" y="512" class="body">No network is needed for the calculation.</text>
<rect x="656" y="398" width="576" height="170" rx="14" fill="#101b32" stroke="#263853"/><rect x="656" y="416" width="3" height="134" rx="1" fill="#72efb0"/><text x="678" y="427" class="micro" style="fill:#72efb0">ON-CHAIN CHECK</text><text x="678" y="458" class="label">Does the chain attest to this evidence?</text>
<text x="678" y="487" class="body">Read the configured V2 contract directly.</text>
<text x="678" y="512" class="body">Check against anchored evidence, not only API data.</text>
<text x="48" y="625" class="body">Integrity proves that evidence matches its commitment. It does not prove an AI answer is factually correct.</text></svg>