<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img"><title>One system. Three paths to trust.</title><desc>Execute a workflow, instrument your own agent, or independently verify recorded evidence.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:35px;font-weight:700;fill:#eef4ff}.label{font-size:21px;font-weight:700;fill:#eef4ff}.body{font-size:17px;fill:#a4b5d0}.micro{font-size:13px;fill:#40e8ed;letter-spacing:2px}.edge{fill:none;stroke:#40e8ed;stroke-width:2;marker-end:url(#arrow)}.secondary{fill:none;stroke:#a995ff;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#purple)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#40e8ed"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#a995ff"/></marker></defs><rect width="1280" height="1080" rx="20" fill="#080e20"/>
