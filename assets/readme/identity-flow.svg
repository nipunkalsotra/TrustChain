<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img"><title>A changed identity becomes an investigation.</title><desc>Continuous integrity connects agent configuration, recorded activity, and human review.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:35px;font-weight:700;fill:#f5f1e9}.label{font-size:21px;font-weight:700;fill:#f5f1e9}.body{font-size:17px;fill:#c1b29e}.micro{font-size:13px;fill:#b3ef69;letter-spacing:2px}.edge{fill:none;stroke:#b3ef69;stroke-width:2;marker-end:url(#arrow)}.secondary{fill:none;stroke:#dcc8a5;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#purple)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#b3ef69"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#dcc8a5"/></marker></defs><rect width="1280" height="450" rx="20" fill="#1c1511"/>
<text x="48" y="63" class="title">A changed identity becomes an investigation.</text>
<text x="48" y="99" class="body">Continuous integrity connects agent configuration, recorded activity, and human review.</text>
<rect x="48" y="160" width="267" height="180" rx="14" fill="#2a2119" stroke="#55432e"/><rect x="48" y="178" width="3" height="144" rx="1" fill="#b3ef69"/><text x="70" y="189" class="micro" style="fill:#b3ef69">01 / REGISTER</text><text x="70" y="220" class="label">Bind a fingerprint</text>
<text x="70" y="249" class="body">Model + version + prompt</text>
<text x="70" y="274" class="body">Client-side configuration hash</text>
<path d="M315 250 H346" class="edge"/>
<rect x="353" y="160" width="267" height="180" rx="14" fill="#2a2119" stroke="#55432e"/><rect x="353" y="178" width="3" height="144" rx="1" fill="#dcc8a5"/><text x="375" y="189" class="micro" style="fill:#dcc8a5">02 / OBSERVE</text><text x="375" y="220" class="label">Compare activity</text>
<text x="375" y="249" class="body">SDK includes its fingerprint</text>
<text x="375" y="274" class="body">Mismatch raises a finding</text>
<path d="M620 250 H651" class="edge"/>
<rect x="658" y="160" width="267" height="180" rx="14" fill="#2a2119" stroke="#55432e"/><rect x="658" y="178" width="3" height="144" rx="1" fill="#b3ef69"/><text x="680" y="189" class="micro" style="fill:#b3ef69">03 / INVESTIGATE</text><text x="680" y="220" class="label">Inspect the evidence</text>
<text x="680" y="249" class="body">Expected / presented hashes</text>
<text x="680" y="274" class="body">Add an investigation note</text>
<path d="M925 250 H956" class="edge"/>
<rect x="963" y="160" width="267" height="180" rx="14" fill="#2a2119" stroke="#55432e"/><rect x="963" y="178" width="3" height="144" rx="1" fill="#b3ef69"/><text x="985" y="189" class="micro" style="fill:#b3ef69">04 / RESOLVE</text><text x="985" y="220" class="label">Close the loop</text>
<text x="985" y="249" class="body">Acknowledge / resolve</text>
<text x="985" y="274" class="body">Reopen with history intact</text>
</svg>