# trustchain.yaml — declares the agents a consumer's repo runs, so their
# fingerprint is derived from source control rather than from whatever
# happens to be in memory at deploy time. Lives in the CONSUMER's repo
# (not this one), next to their agent code. See
# docs/examples/agents-ci-gate.yml for the CI job that reads this.
project: prod
agents:
  - id: support-bot
    model: gpt-4o
    version: "2025-11"
    system_prompt_file: prompts/support.txt
  - id: risk-scorer
    model: claude-sonnet-5
    version: "3.1"
    system_prompt_file: prompts/risk.md
