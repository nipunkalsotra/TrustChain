# Deployment pipeline (P2.8): staging auto-deploys every release, production
# requires a manual approval gate (via a GitHub Environment protection
# rule — see docs/release-process.md for how to configure it; that
# protection lives in repo Settings, not in this file).
#
# HONEST LIMITATION: this repo has no real staging/production
# infrastructure target configured (no cloud account, no server, no
# kubeconfig). Each deploy job below is conditional on that: if the
# DEPLOY_HOST/DEPLOY_SSH_KEY GitHub Environment secrets exist (see
# docs/release-process.md's "Honest limitation" section for how to add
# them once a real target does), it SSHes there for real and runs
# `DEPLOY_MODE=pull bash deploy/canary_rollout.sh <version>` on that host.
# Until then, it runs deploy/canary_rollout.sh FOR REAL anyway —
# DEPLOY_MODE=build, against this job's own ephemeral docker-compose
# stack — rather than only ever describing the command in a comment. That
# means every release genuinely exercises the real deploy/bake/
# auto-rollback-on-failure control flow (not deploy/canary_rollout_test.sh's
# synthetic stubs — canary_rollout.sh unmodified, doing exactly what it
# would do against a real host), even with no real target to point it at
# yet. The day DEPLOY_HOST/DEPLOY_SSH_KEY exist, the SAME job switches to
# the real SSH path automatically — no rewrite needed.
name: Deploy
permissions: {}
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (e.g. 1.4.0) — required for manual runs"
        required: true

jobs:
  resolve-version:
    name: Resolve version to deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Triggered by the Release workflow completing — its jobs
            # already exposed the version it just published (see
            # release.yml's `release` job outputs); workflow_run doesn't
            # let this workflow read that job's outputs directly, so this
            # re-derives it the same way release.yml itself did: the
            # latest annotated tag on main.
            git fetch --tags --quiet https://github.com/${{ github.repository }} main 2>/dev/null || true
            echo "version=$(git ls-remote --tags --sort=-v:refname https://github.com/${{ github.repository }} 'v*' | head -1 | sed 's/.*refs\/tags\/v//')" >> "$GITHUB_OUTPUT"
          fi

  staging:
    name: Deploy to staging
    needs: resolve-version
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.trustchain.example  # placeholder — replace once a real staging host exists
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Cache Foundry build artifacts
        # Same cache as test.yml's jobs — see that file's comment.
        uses: actions/cache@v4
        with:
          path: |
            contracts/cache
            contracts/out
          key: forge-${{ runner.os }}-${{ hashFiles('contracts/src/**/*.sol', 'contracts/lib/**/*.sol', 'contracts/foundry.toml', 'contracts/remappings.txt') }}
          restore-keys: |
            forge-${{ runner.os }}-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same real-stack bootstrap as test.yml's sdk-integration job — the
      # bake loop below polls a REAL /ready endpoint, so there has to be a
      # real API behind it. See that job's comments for why each step is
      # needed.
      - name: Write backend/.env for docker compose
        run: |
          cat > backend/.env <<EOF
          JWT_SECRET=ci-test-secret-not-for-production-use-only
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          EOF
      - name: Start postgres/redis/anvil/mcp servers
        run: docker compose up -d --build postgres redis anvil mcp-search mcp-blockchain
      - name: Wait for Postgres readiness
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U trustchain -d trustchain && break
            sleep 1
          done
      - name: Install backend dependencies (for alembic)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/pip_install_retry.sh" -r requirements-dev.txt
        working-directory: backend
      - name: Apply database migrations (creates trustchain_api + RLS policies)
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://trustchain:trustchain@localhost:5432/trustchain
      - name: Build contracts
        run: forge build
        working-directory: contracts
      - name: Extract V2 ABIs for the backend
        run: python3 backend/scripts/extract_v2_abis.py
      - name: Deploy V2 contracts to Anvil
        run: forge script script/DeployV2.s.sol --rpc-url http://localhost:8545 --broadcast
        working-directory: contracts
        env:
          PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      - name: Record deployed V2 addresses
        run: python3 backend/scripts/write_v2_addresses.py --chain-id 31337
      - name: Deploy backend/mcp images to staging (canary + auto-rollback)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "Real staging host configured — deploying for real over SSH."
            install -m 600 /dev/null /tmp/deploy_key
            echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
            ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key "deploy@${DEPLOY_HOST}" \
              "cd /opt/trustchain && DEPLOY_MODE=pull bash deploy/canary_rollout.sh '${VERSION}'"
          else
            echo "No DEPLOY_HOST/DEPLOY_SSH_KEY environment secrets configured yet"
            echo "(see docs/release-process.md's \"Honest limitation\" section)."
            echo "Running deploy/canary_rollout.sh for real anyway, against this"
            echo "job's own ephemeral docker-compose stack (DEPLOY_MODE=build) —"
            echo "exercises the real deploy/bake/auto-rollback control flow rather"
            echo "than only documenting it."
            bash deploy/canary_rollout.sh "ci-${VERSION}"
          fi
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs api anchor-worker indexer mcp-search mcp-blockchain --tail 200

  production:
    name: Deploy to production
    needs: [resolve-version, staging]
    runs-on: ubuntu-latest
    # A GitHub Environment named "production" with required reviewers
    # configured (Settings > Environments > production > Deployment
    # protection rules) makes THIS JOB pause for manual approval before
    # running — that gate lives in repo settings, not in this YAML, and
    # needs a repo admin to set it up once. See docs/release-process.md.
    environment:
      name: production
      url: https://trustchain.example  # placeholder — replace once a real production host exists
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Cache Foundry build artifacts
        # Same cache as test.yml's jobs — see that file's comment.
        uses: actions/cache@v4
        with:
          path: |
            contracts/cache
            contracts/out
          key: forge-${{ runner.os }}-${{ hashFiles('contracts/src/**/*.sol', 'contracts/lib/**/*.sol', 'contracts/foundry.toml', 'contracts/remappings.txt') }}
          restore-keys: |
            forge-${{ runner.os }}-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write backend/.env for docker compose
        run: |
          cat > backend/.env <<EOF
          JWT_SECRET=ci-test-secret-not-for-production-use-only
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          EOF
      - name: Start postgres/redis/anvil/mcp servers
        run: docker compose up -d --build postgres redis anvil mcp-search mcp-blockchain
      - name: Wait for Postgres readiness
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U trustchain -d trustchain && break
            sleep 1
          done
      - name: Install backend dependencies (for alembic)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/pip_install_retry.sh" -r requirements-dev.txt
        working-directory: backend
      - name: Apply database migrations (creates trustchain_api + RLS policies)
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://trustchain:trustchain@localhost:5432/trustchain
      - name: Build contracts
        run: forge build
        working-directory: contracts
      - name: Extract V2 ABIs for the backend
        run: python3 backend/scripts/extract_v2_abis.py
      - name: Deploy V2 contracts to Anvil
        run: forge script script/DeployV2.s.sol --rpc-url http://localhost:8545 --broadcast
        working-directory: contracts
        env:
          PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      - name: Record deployed V2 addresses
        run: python3 backend/scripts/write_v2_addresses.py --chain-id 31337
      - name: Deploy backend/mcp images to production (canary + auto-rollback)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "Real production host configured — deploying for real over SSH."
            install -m 600 /dev/null /tmp/deploy_key
            echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
            ssh -o StrictHostKeyChecking=accept-new -i /tmp/deploy_key "deploy@${DEPLOY_HOST}" \
              "cd /opt/trustchain && DEPLOY_MODE=pull bash deploy/canary_rollout.sh '${VERSION}'"
          else
            echo "No DEPLOY_HOST/DEPLOY_SSH_KEY environment secrets configured yet"
            echo "(see docs/release-process.md's \"Honest limitation\" section)."
            echo "Running deploy/canary_rollout.sh for real anyway, against this"
            echo "job's own ephemeral docker-compose stack (DEPLOY_MODE=build) —"
            echo "exercises the real deploy/bake/auto-rollback control flow rather"
            echo "than only documenting it."
            bash deploy/canary_rollout.sh "ci-${VERSION}"
          fi
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs api anchor-worker indexer mcp-search mcp-blockchain --tail 200
