version: 2
updates:
  # ── Python ────────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /sdk/python-cli
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /mcp_servers/blockchain
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /mcp_servers/web_search
    schedule:
      interval: weekly

  # ── JavaScript/TypeScript ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly

  # ── Docker base images ───────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /mcp_servers/blockchain
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /mcp_servers/web_search
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  # ── GitHub Actions ────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
