# Prometheus scrape config for the local dev stack (docker-compose.yml).
# Three targets: the API (its own /metrics route, main.py) and the anchor
# worker / indexer (each a plain asyncio loop with no HTTP server of its
# own otherwise — they start a dedicated prometheus_client HTTP server via
# observability.start_metrics_server(), see backend/observability.py).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: trustchain-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: trustchain-anchor-worker
    static_configs:
      - targets: ["anchor-worker:9101"]

  - job_name: trustchain-indexer
    static_configs:
      - targets: ["indexer:9102"]
