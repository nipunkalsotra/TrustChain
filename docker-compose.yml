# TrustChain local development stack: postgres (write + read model), anvil
# (local chain — never Monad testnet in CI/dev-by-default), redis (SSE
# event bus across API replicas + rate limiting — see backend/run_events.py
# and backend/rate_limit.py), the API, the anchor worker, the indexer, and
# both MCP servers /run-agent needs to actually complete a pipeline run.
#
# The anchor worker and indexer both need V2 contracts already deployed to
# `anvil` and their addresses recorded at backend/contracts/addresses_v2.json
# before they can do anything useful — see contracts/script/DeployV2.s.sol.
# Both degrade to a harmless retry loop (logged, not crash-looping) if that
# file is missing.
#
# Usage:
#   docker compose up --build
#   docker compose down -v   # -v also drops the postgres volume

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trustchain
      POSTGRES_PASSWORD: trustchain
      POSTGRES_DB: trustchain
    ports:
      - "5432:5432"
    volumes:
      - trustchain_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustchain -d trustchain"]
      interval: 2s
      timeout: 3s
      retries: 30

  anvil:
    build:
      context: .
      dockerfile: docker/Dockerfile.anvil
    ports:
      - "8545:8545"
    healthcheck:
      # anvil has no HTTP health endpoint; a JSON-RPC eth_blockNumber call
      # is the standard liveness probe for it.
      test: >
        curl -sf -X POST -H "Content-Type: application/json"
        --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
        http://localhost:8545 | grep -q result
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mcp-search:
    build:
      context: ./mcp_servers/web_search
    env_file:
      - path: ./mcp_servers/web_search/.env
        required: false
    ports:
      - "8001:8001"

  mcp-blockchain:
    build:
      context: .
      dockerfile: mcp_servers/blockchain/Dockerfile
    env_file:
      # Same V1 testnet creds as `api`'s BlockchainBridge — this server
      # wraps the identical blockchain/client.py, so it needs the same
      # MONAD_RPC_URL/PRIVATE_KEY, not the V2/Anvil pair.
      - path: ./backend/.env
        required: false
    ports:
      - "8002:8002"

  api:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # trustchain_api, NOT the trustchain superuser anchor-worker/indexer
      # use below — it's the role Postgres Row-Level Security actually
      # binds to (the table owner/a superuser always bypasses RLS, so
      # runs/steps/idempotency_keys/audit_events's tenant-isolation
      # policies only take effect for a distinct, non-owner role). Created
      # by alembic/versions/9f3a1c7d5e2b_row_level_security_for_tenant_tables.py —
      # `alembic upgrade head` must run against `postgres` before this
      # service can start, same as it always has for schema itself.
      DATABASE_URL: postgresql+asyncpg://trustchain_api:trustchain_api_dev_password@postgres:5432/trustchain
      REDIS_URL: redis://redis:6379/0
      # V1's BlockchainBridge (still used by /verify, /verify/tamper-demo,
      # /verify-audit) keeps reading MONAD_RPC_URL/PRIVATE_KEY from .env —
      # the real testnet, where V1 was actually deployed. agents/scorer.py's
      # V2 score writes (blockchain/score_writer.py -> anchor_worker.chain)
      # need a *separate* pointer at `anvil`, where V2 was deployed for
      # local dev — see config.py's v2_rpc_url/v2_private_key docstring.
      V2_RPC_URL: http://anvil:8545
      V2_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      # "localhost" inside this container is the container itself, not the
      # mcp-search/mcp-blockchain containers — override config.py's
      # localhost-default MCP URLs to the sibling services' Compose names.
      MCP_SEARCH_URL: http://mcp-search:8001/mcp
      MCP_BLOCKCHAIN_URL: http://mcp-blockchain:8002/mcp
    # Bind-mounted, not baked in by the image's own COPY . . (backend/Dockerfile) —
    # a fresh `forge script DeployV2.s.sol --broadcast` against local Anvil
    # writes new addresses here (scripts/write_v2_addresses.py) far more
    # often than the image itself changes, and picking that up should only
    # need `docker compose restart`, not a full `--build` (which, since
    # Anvil has no persistent volume, wipes all chain state right back to
    # block 0 — the exact addresses this mount just updated would
    # immediately go stale again).
    volumes:
      - ./backend/contracts/addresses_v2.json:/app/contracts/addresses_v2.json:ro
    ports:
      - "8000:8000"
    # F14 (Graceful shutdown): Docker's own default here is 10s SIGTERM ->
    # SIGKILL, which is LESS than uvicorn's own --timeout-graceful-shutdown
    # (10s, see the Dockerfile CMD) alone — SIGKILL would already have
    # fired before uvicorn even finishes draining HTTP/SSE connections,
    # let alone before main.py's lifespan shutdown (which drains in-flight
    # /run-agent background tasks, api_shutdown_drain_timeout_seconds
    # default 5s) ever runs. 30s comfortably covers
    # uvicorn's 10s + the drain's 5s + margin for the DB writes shutdown
    # does along the way, without indefinitely blocking a redeploy.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      anvil:
        condition: service_healthy
      mcp-search:
        condition: service_started
      mcp-blockchain:
        condition: service_started
    healthcheck:
      # /ready, not /health — readiness only hard-requires the database
      # (chain is informational there), so this doesn't flap on RPC hiccups.
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  anchor-worker:
    build:
      context: ./backend
    command: ["python3", "-m", "anchor_worker.main"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://trustchain:trustchain@postgres:5432/trustchain
      MONAD_RPC_URL: http://anvil:8545
      # Anvil's well-known default account #0 — public, funded only on
      # local chains anvil itself spins up. DeployV2.s.sol grants this
      # account ANCHOR_ROLE when RELAYER_ADDRESS is left unset (the local
      # dev default). Overridden here, not read from backend/.env, because
      # .env's PRIVATE_KEY is the real testnet deployer key `api` uses for
      # V1's BlockchainBridge — the anchor worker talks to `anvil`, not
      # Monad testnet, in this compose file.
      PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      # Production's default (config.py's anchor_max_batch_age_seconds,
      # 30.0) is right for a real deployment where batching efficiency
      # matters more than per-step latency — but that same default here
      # means a single locally-logged step (SDK examples, local demos,
      # anyone manually poking POST /steps) can sit unanchored for up to
      # 30+ real seconds before this worker's accumulation window even
      # considers it stale enough to flush, a real responsiveness
      # regression for local dev/demo use that this override exists to
      # avoid — found via a real SDK integration test's 30s polling
      # deadline actually timing out against this exact default.
      ANCHOR_MAX_BATCH_AGE_SECONDS: "5"
    # See `api`'s identical mount above for why this is bind-mounted
    # rather than baked into the image.
    volumes:
      - ./backend/contracts/addresses_v2.json:/app/contracts/addresses_v2.json:ro
    ports:
      - "9101:9101"   # Prometheus /metrics — see backend/observability.py
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy

  # Phase 3 — continuous integrity monitoring (integrity_watchdog/main.py)
  # + the alert-email sender loop (notifications/sender.py), run in-process
  # together rather than as two containers — see integrity_watchdog/main.py's
  # own module docstring for why. Connects as the `trustchain` superuser,
  # same as anchor-worker/indexer above and for the same reason: sweeping
  # every project's steps/batches for tamper evidence is legitimately
  # cross-tenant work RLS is not meant to restrict (ADR-0006).
  integrity-watchdog:
    build:
      context: ./backend
    command: ["python3", "-m", "integrity_watchdog.main"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://trustchain:trustchain@postgres:5432/trustchain
      MONAD_RPC_URL: http://anvil:8545
      # Deliberately NOT hardcoded here (was pinned to "brevo" earlier in
      # Phase 3 to verify real delivery for real — confirmed working, see
      # docs/adr/0020-database-audit-logging-and-attribution.md — and then
      # reverted). EMAIL_BACKEND now comes from env_file: ./backend/.env
      # above like everything else Brevo/SMTP-related, defaulting to
      # config.py's "console" (log-only, no network call) when that file
      # doesn't set it. Set EMAIL_BACKEND=brevo (or smtp) in your own
      # backend/.env, never in this committed file, to send real email.
    volumes:
      - ./backend/contracts/addresses_v2.json:/app/contracts/addresses_v2.json:ro
    ports:
      - "9103:9103"   # Prometheus /metrics — see backend/observability.py
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy

  indexer:
    build:
      context: ./backend
    command: ["python3", "-m", "indexer.main"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://trustchain:trustchain@postgres:5432/trustchain
      MONAD_RPC_URL: http://anvil:8545
    # See `api`'s identical mount above for why this is bind-mounted
    # rather than baked into the image.
    volumes:
      - ./backend/contracts/addresses_v2.json:/app/contracts/addresses_v2.json:ro
    ports:
      - "9102:9102"   # Prometheus /metrics — see backend/observability.py
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - anchor-worker
      - indexer

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - trustchain_loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only access to every container's own log files + the Docker
      # socket (for docker_sd_configs' container auto-discovery/labeling)
      # — this is what lets promtail ship every OTHER service's stdout
      # without a per-service scrape config to maintain.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Host 3002, not 3001 — main.py's CORS allowlist documents 3001 as
      # the Next.js dev server's alt port; avoid colliding with it for
      # anyone running frontend dev alongside this compose file.
      - "3002:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  trustchain_postgres_data:
  trustchain_loki_data:
