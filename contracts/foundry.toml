[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
solc    = "0.8.20"
optimizer       = true
optimizer_runs  = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read", path = "test/fixtures" }]

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"