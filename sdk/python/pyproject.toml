[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustchain-sdk"
version = "0.1.0"
description = "Python client for the TrustChain API — start and stream agent pipeline runs, read trust scores/audit history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1.0",
    "eth-utils>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# On-chain proof verification (TrustChain.verify_proof_onchain) needs a
# real RPC client — not required for the rest of the SDK, including the
# default local-only TrustChain.verify_proof.
onchain = [
    "web3>=7.0",
]
# LangChain integration (trustchain_sdk.integrations.langchain).
langchain = [
    "langchain-core>=0.3",
]

[tool.setuptools.packages.find]
include = ["trustchain_sdk*"]
